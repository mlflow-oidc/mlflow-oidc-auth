repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args:
          - --maxkb=800
        # Generated API contract (#458): it grows with the API, and CI checks it for drift.
        exclude: ^(openapi\.json|web-react/src/core/types/generated/openapi\.ts)$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-toml
  - repo: https://github.com/ambv/black
    rev: 26.1.0
    hooks:
      - id: black
