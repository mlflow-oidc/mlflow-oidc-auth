name: bandit
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
    paths:
      - mlflow_oidc_auth/**

jobs:
  # Scans the trusted base revision with network access and a security-events write token.
  main:
    name: Run bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Bandit
        run: python -m pip install 'bandit[sarif,toml]'
      - name: Run Bandit
        run: >-
          bandit --severity-level high --confidence-level high
          -x '.svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg'
          -r . -f sarif -o results.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
