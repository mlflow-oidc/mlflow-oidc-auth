name: Semantic Pull Request
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read
  statuses: write

jobs:
  main:
    name: Conventional commit title validation
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must equal allowed-commit-types in commit-message-check.yml
          # (mlflow_oidc_auth/tests/test_workflow_commit_types.py enforces it).
          # Releases come from @semantic-release/commit-analyzer's default angular rules:
          # feat -> minor, fix and perf -> patch (perf gets its own "Performance
          # Improvements" changelog section), the rest -> no release on their own. A
          # "BREAKING CHANGE:" footer in the squash body forces a major release whatever
          # the type. The angular release notes list only feat, fix, perf, revert and
          # breaking changes, so a refactor that changes behaviour operators should know
          # about belongs in a fix/feat/perf PR or in the release notes by hand.
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            ci
            chore
            build
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
          wip: true
