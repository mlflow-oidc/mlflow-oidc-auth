name: "Conventional commit message checker"
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check-commit-message:
    name: Validate Commit Message
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Commit Type
        uses: gsactions/commit-message-checker@v2
        with:
          # "revert" is a Conventional Commits type; `Revert "..."` is the subject `git revert` writes.
          pattern: '^(|feat|fix|chore|docs|style|ci|refactor|perf|test|build|revert)(\([\w-]+\))?:\s.+$|^(Merge\sbranch)|^(Merge\sremote)|^Revert\s".+"$'
          error: 'Your first line has to contain a commit type like "feat|fix|chore|docs|style|ci|refactor|perf|test|revert".'
          excludeDescription: "true"
          excludeTitle: "true"
          checkAllCommitMessages: "true"
          accessToken: ${{ secrets.GITHUB_TOKEN }}
