name: "Conventional commit message checker"
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check-commit-message:
    name: Validate Commit Message
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Commit Type
        # Pinned to the commit of v1.4.2: a small third-party action that reads fork PR metadata.
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must include every type pr-validate-title.yml allows for PR titles (these are a superset).
          # The action also accepts subjects git writes itself ("Merge ...", "Revert ...", "Reapply ...").
          allowed-commit-types: "feat,fix,chore,docs,style,ci,refactor,perf,test,build,revert"
