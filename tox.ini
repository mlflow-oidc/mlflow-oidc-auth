[tox]
envlist = py314
skipsdist = True

[testenv]
deps =
    pytest
    coverage<=7.6
    httpx
    # Only used by the migration tests, and only when MLFLOW_OIDC_TEST_POSTGRES_URI points at a
    # server; they skip without one. Migrations have to be verified on both backends (#333).
    psycopg2-binary
passenv =
    MLFLOW_OIDC_TEST_POSTGRES_URI
commands =
    pip install -e '.[full,test]'
    coverage run -m pytest -s -m "not integration" mlflow_oidc_auth/tests
    coverage xml

[testenv:adversarial]
description = Run only the adversarial token / authorization-response suite (#307).
deps = {[testenv]deps}
commands =
    pip install -e '.[full,test]'
    # Also runs as part of the default env, since it lives under mlflow_oidc_auth/tests. This
    # env exists so the suite can be run on its own — when reviewing an auth change, or from a
    # workflow that gates on it specifically.
    pytest -q mlflow_oidc_auth/tests/adversarial mlflow_oidc_auth/tests/test_token_algorithm_pinning.py

[testenv:integration]
description = Run browser-based integration tests against a running mlflow-oidc-auth instance.
deps =
    {[testenv]deps}
    playwright
    httpx
    mlflow>=3.14.0,<4
    httpx
passenv =
    MLFLOW_OIDC_E2E_BASE_URL
    MLFLOW_OIDC_E2E_REQUIRE
    OIDC_*
    AUTH0_*
    OKTA_*
    KEYCLOAK_*
    MLFLOW_*
commands_pre =
    python -m playwright install chromium
commands =
    pip install -e '.[full,test]'
    pytest -m integration mlflow_oidc_auth/tests/integration {posargs}

[testenv:integration-live]
description = Run integration tests against an already running mlflow-oidc-auth instance (no install/setup).
skip_install = True
deps =
    {[testenv]deps}
    playwright
    mlflow>=3.14.0,<4
passenv = {[testenv:integration]passenv}
commands_pre =
    python -m pip install "mlflow<4,>=3.14.0"
commands =
    pytest -m integration mlflow_oidc_auth/tests/integration {posargs}

[coverage:run]
# relative_files = True
source = mlflow_oidc_auth/
branch = True
