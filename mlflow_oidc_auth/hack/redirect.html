<script>
    (function () {
        "use strict";

        // MLflow's bundled UI ships admin pages built for its own basic-auth RBAC
        // (#/admin..., #/account). Those pages call APIs this plugin does not
        // implement, so send the browser to the plugin's own UI instead. The hash
        // never reaches the server, so this has to happen client-side.
        //
        // Security: values taken from the hash are only ever passed through
        // encodeURIComponent into a path that is relative to the page and starts
        // with "oidc/ui/". Nothing is written to the DOM.

        // BEGIN mapAdminRoute (tests evaluate the code between these markers)
        var BASE = "oidc/ui/";

        function decode(value) {
            try {
                return decodeURIComponent(value);
            } catch (e) {
                return value;
            }
        }

        // A segment that is empty or made only of dots would be collapsed by URL
        // resolution ("users/../experiments"), so it maps to the list page instead.
        function segment(value) {
            if (!value || /^\.+$/.test(value)) return null;
            return encodeURIComponent(value);
        }

        // Pure: maps a location.hash to a relative target, or null when the hash
        // is not one of MLflow's admin routes.
        function mapAdminRoute(hash) {
            var route = String(hash || "");
            if (route.charAt(0) === "#") route = route.slice(1);
            var q = route.indexOf("?");
            var path = q === -1 ? route : route.slice(0, q);
            var params = new URLSearchParams(q === -1 ? "" : route.slice(q + 1));

            if (path === "/account" || path.indexOf("/account/") === 0) return BASE + "user";
            if (path !== "/admin" && path.indexOf("/admin/") !== 0) return null;

            if (path === "/admin/roles" || path.indexOf("/admin/roles/") === 0) return BASE + "groups";
            if (path.indexOf("/admin/users/") === 0) {
                // The user is the first segment; anything after it is a sub-page of that user.
                var rest = path.slice("/admin/users/".length);
                var slash = rest.indexOf("/");
                var user = segment(decode(slash === -1 ? rest : rest.slice(0, slash)));
                return user ? BASE + "users/" + user + "/experiments" : BASE + "users";
            }
            if (path === "/admin/ws" || path.indexOf("/admin/ws/") === 0) {
                var ws = segment(params.get("workspace"));
                return ws ? BASE + "workspaces/" + ws : BASE + "workspaces";
            }
            if ((path === "/admin" || path === "/admin/") && params.get("tab") === "roles") return BASE + "groups";
            // Any other page of MLflow's admin area: the plugin's user list.
            return BASE + "users";
        }
        // END mapAdminRoute

        function redirect() {
            var target = mapAdminRoute(window.location.hash);
            if (target) window.location.replace(target);
        }

        // MLflow's router navigates with history.pushState, which fires neither
        // hashchange nor popstate, so the history methods are wrapped as well.
        function wrap(name) {
            var original = window.history && window.history[name];
            if (typeof original !== "function") return;
            window.history[name] = function () {
                var result = original.apply(this, arguments);
                redirect();
                return result;
            };
        }

        wrap("pushState");
        wrap("replaceState");
        window.addEventListener("hashchange", redirect);
        window.addEventListener("popstate", redirect);
        redirect();
    })();
</script>
