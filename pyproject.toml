[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-oidc-auth"
dynamic = ["version"]
description = "Authentication and access control for MLflow: SSO (OIDC, SAML), SCIM provisioning and per-resource permissions"
readme = "README.md"
keywords = ["mlflow", "access-control", "authentication", "authorization", "oidc", "oauth2", "saml", "scim", "sso", "rbac"]
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = [
  "mlflow<4,>=3.14.0",
  "python-dotenv<2",
  "requests<3,>=2.32.5",
  # Our requests calls verify TLS against the operating system's store, as httpx2 does for the
  # OIDC client (mlflow_oidc_auth/http_client.py).
  "truststore>=0.10",
  "sqlalchemy<3,>=2.0.46",
  "flask<4",
  "gunicorn<24; platform_system != 'Windows'",
  "alembic<2,!=1.18.4",
  # 1.8 is the first release whose httpx integration works on httpx2 alone (httpx is no longer a dependency).
  "authlib>=1.8,<2",
  "joserfc>=1.7,<2",
  "uvicorn>=0.41.0",
  "fastapi>=0.132.0",
  "asgiref>=3.11.1",
  "httpx2>=2.0.0",
  "cachetools>=5.5.0"
]

[project.optional-dependencies]
dev = [
  "black<26,>=24.8.0",
  "pytest<9,>=8.3.2",
  "pre-commit<5",
  "autoflake<2"
]
test = [
  "pytest<9,>=8.3.2",
  "pytest-cov<6,>=5.0.0",
  "pytest-asyncio<2",
  "httpx2<3,>=2.0.0",
]
# Cloud provider optional dependencies for pluggable config
aws = [
  "boto3>=1.42.26",
]
azure = [
  "azure-identity>=1.25.1",
  "azure-keyvault-secrets>=4.10.0",
]
vault = [
  "hvac>=2.4.0",
]
# SAML 2.0 provider support (issue #327/#328). python3-saml ships pure-Python; its native
# dependency python-xmlsec publishes binary wheels for manylinux, macOS and Windows on
# CPython 3.10+, so no compiler or libxmlsec1 headers are needed for a wheel install.
saml = [
  "python3-saml>=1.16.0,<2",
  "xmlsec>=1.3.14,<2",
]
# All cloud providers combined
cloud = [
  "boto3>=1.42.26",
  "azure-identity>=1.25.1",
  "azure-keyvault-secrets>=4.10.0",
  "hvac>=2.4.0",
]
# Every optional runtime feature. tox installs this so no test suite skips itself for a
# missing extra (pip ignores an unknown extra silently, which is how the SAML suite went
# unexecuted in CI).
full = [
  "boto3>=1.42.26",
  "azure-identity>=1.25.1",
  "azure-keyvault-secrets>=4.10.0",
  "hvac>=2.4.0",
  "python3-saml>=1.16.0,<2",
  "xmlsec>=1.3.14,<2",
]
# Redis cache backend
cache = [
  "redis>=5.0.0,<6",
]

[[project.maintainers]]
name = "Alexander Kharkevich"
email = "alex@kharkevich.org"

[project.urls]
homepage = "https://github.com/mlflow-oidc/mlflow-oidc-auth"
issues = "https://github.com/mlflow-oidc/mlflow-oidc-auth/issues"
documentation = "https://github.com/mlflow-oidc/mlflow-oidc-auth/tree/main/docs/"
repository = "https://github.com/mlflow-oidc/mlflow-oidc-auth"

[project.scripts]
mlflow-oidc-server = "mlflow_oidc_auth.cli:run"

[project.entry-points."mlflow.app"]
oidc-auth = "mlflow_oidc_auth.app:app"

[tool.setuptools.package-data]
mlflow_oidc_auth = [
  "db/migrations/alembic.ini",
  "hack/menu.html",
  "hack/reauth.html",
  "ui/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlflow_oidc_auth", "mlflow_oidc_auth.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.dynamic]
version = {attr = "mlflow_oidc_auth.version"}

[tool.black]
line-length = 160

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["mlflow_oidc_auth/tests"]
# A deprecation (or an un-awaited coroutine) raised from this package fails the suite, so new
# ones are fixed when introduced instead of piling up in the warnings summary (#407). Known
# third-party warnings we cannot fix here are ignored by message; drop each filter once a
# release within our supported range fixes it.
filterwarnings = [
  "error::DeprecationWarning:mlflow_oidc_auth",
  "error::PendingDeprecationWarning:mlflow_oidc_auth",
  "error::RuntimeWarning:mlflow_oidc_auth",
  # python3-saml 1.16.0: datetime.utcnow()/utcfromtimestamp(); fixed upstream in
  # SAML-Toolkits/python3-saml#420, not yet released.
  "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:onelogin",
  "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:onelogin",
  # MLflow's own tracking store uses the deprecated noload loader strategy. Scoped to MLflow's
  # modules ("mlflow\\." — a bare "mlflow" would also match mlflow_oidc_auth), so a noload
  # reintroduced in this package still fails.
  "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning:mlflow\\.",
  # MLflow's fastapi_app imports starlette.middleware.wsgi (mlflow/mlflow#24074).
  "ignore:starlette.middleware.wsgi is deprecated:UserWarning:mlflow\\.",
]
markers = [
  "integration: end-to-end tests that require a running server",
  "e2e: identity end-to-end tests against a real Keycloak and a real app server (tox -e e2e)",
]
norecursedirs = [
  "mlruns",
  "mlruns.old",
  "htmlcov",
  "__pycache__",
  "integration",
]
